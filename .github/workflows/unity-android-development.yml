name: Unity Android development APK (opt-in)

# This job is disabled until Unity licensing has been configured by the
# repository owner in Actions secrets, and RELIGHT_UNITY_CI is set to 'enabled'.
# It never creates a store-ready release or uses production signing keys.
on:
  push:
    branches:
      - 'feat/**'
      - 'fix/**'
      - 'build/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-development-apk:
    name: Unity 6000.1.9f1 Android development APK
    if: ${{ vars.RELIGHT_UNITY_CI == 'enabled' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout Relight project
        uses: actions/checkout@v4

      - name: Verify license inputs are configured
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        shell: bash
        run: |
          if [ -z "$UNITY_EMAIL" ] || [ -z "$UNITY_PASSWORD" ]; then
            echo "::error::Configure UNITY_EMAIL and UNITY_PASSWORD as GitHub Actions secrets."
            exit 1
          fi
          if [ -z "$UNITY_LICENSE" ] && [ -z "$UNITY_SERIAL" ]; then
            echo "::error::Configure UNITY_LICENSE (Personal) or UNITY_SERIAL (professional) as a GitHub Actions secret."
            exit 1
          fi
          echo "License inputs exist. Values are intentionally not displayed."

      - name: Build Relight Android development APK with the real Unity Editor
        uses: game-ci/unity-builder@v4
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          projectPath: .
          unityVersion: 6000.1.9f1
          targetPlatform: Android
          androidExportType: androidPackage
          buildMethod: Relight.Editor.RelightProjectSetup.BuildAndroid

      - name: Confirm Unity produced a nonempty new development APK
        shell: bash
        run: |
          test -s Builds/Relight-dev.apk || {
            echo "::error::The custom Unity build method did not produce Builds/Relight-dev.apk."
            exit 1
          }
          echo "Android development APK exists ($(stat -c%s Builds/Relight-dev.apk) bytes)."

      - name: Save installable development APK as a GitHub artifact
        uses: actions/upload-artifact@v4
        with:
          name: Relight-Android-Dev-${{ github.sha }}
          path: Builds/Relight-dev.apk
          if-no-files-found: error
          retention-days: 14

# A skipped run is NOT evidence of a successful Android build. A completed
# successful build still needs manual installation and device validation.
