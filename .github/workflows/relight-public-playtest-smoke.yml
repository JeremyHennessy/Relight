name: Relight public web playtest — HTTP and Chromium smoke
on:
  push:
    branches:
      - feat/relight-first-play-ux-v2
    paths:
      - .github/workflows/relight-public-playtest-smoke.yml
      - web-preview/app.mjs
      - web-preview/browser-reliability.mjs
      - web-preview/browser-smoke.mjs
      - web-preview/favicon.svg
      - web-preview/index.html
      - web-preview/model.mjs
      - web-preview/styles.css
      - web-preview/verify-hosted-assets.mjs
      - web-preview/verify-hosted-assets.test.mjs
      - web-preview/model-reliability.test.mjs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-website:
    # Run only on the approved feature branch after its production assets were
    # deployed. This job verifies public assets and browser behavior; it has no
    # deployment step or write permissions.
    if: ${{ github.ref == 'refs/heads/feat/relight-first-play-ux-v2' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    name: Verify published game is available and genuinely playable
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Check real public HTTP responses and expected assets
        env:
          RELIGHT_BROWSER_URL: https://relight-ux-playtest.pages.dev
        run: |
          set -euo pipefail
          for asset in / /app.mjs /model.mjs /styles.css /favicon.svg; do
            dest="/tmp/relight-live-$(echo "${asset}" | tr '/.' '__')"
            echo "Fetching ${RELIGHT_BROWSER_URL}${asset}"
            curl --fail --show-error --silent --location --retry 3 --retry-delay 3 --max-time 20 \
              "${RELIGHT_BROWSER_URL}${asset}" -o "${dest}"
            test -s "${dest}"
          done
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exercise hosted asset verification with offline fixtures
        run: node --test web-preview/verify-hosted-assets.test.mjs
      - name: Verify exact tested source assets are publicly hosted
        env:
          RELIGHT_BROWSER_URL: https://relight-ux-playtest.pages.dev
        run: node web-preview/verify-hosted-assets.mjs
      - name: Verify required mobile-feedback markers in hash-matched assets
        run: |
          set -euo pipefail
          # The parity step above verified these checked-out source bytes against the live site.
          grep -q '<title>Relight' web-preview/index.html
          grep -q 'from "./model.mjs"' web-preview/app.mjs
          grep -Fq 'MINE is already selected for you' web-preview/app.mjs
          grep -Fq 'function mobileFeedback(message,warning=false)' web-preview/app.mjs
          grep -Fq '.mobile-feedback{display:none}' web-preview/styles.css
          grep -Fq 'id="mobile-feedback"' web-preview/index.html
          echo "PASS: hash-matched assets include accessible inline mobile feedback"
      - name: Install Chromium browser test tooling
        run: |
          npm install --prefix web-preview --no-save --no-package-lock playwright@1.56.1
          ./web-preview/node_modules/.bin/playwright install --with-deps chromium
      - name: Play the hosted game on phones and desktop
        env:
          RELIGHT_BROWSER_URL: https://relight-ux-playtest.pages.dev
        run: node web-preview/browser-smoke.mjs
      - name: Check hosted save safety, feedback and responsive layouts
        env:
          RELIGHT_BROWSER_URL: https://relight-ux-playtest.pages.dev
        run: node web-preview/browser-reliability.mjs
      - name: Validate expected hosted gameplay screenshots
        if: always()
        run: |
          set -euo pipefail
          expected=(
            relight-firstlight-390-v3-opening-viewport.png
            relight-firstlight-390-v3-opening-full.png
            relight-firstlight-1440-v3-opening-viewport.png
            relight-firstlight-1440-v3-opening-full.png
            relight-firstlight-390-v3-investment-choice.png
            relight-firstlight-390-v3-priority-installed.png
            relight-firstlight-390-v3-field-link.png
            relight-firstlight-390-v3-ready-mine.png
            relight-firstlight-desktop-v3-investment-choice.png
            relight-firstlight-desktop-v3-priority-installed.png
            relight-firstlight-desktop-v3-field-link.png
            relight-firstlight-desktop-v3-ready-power.png
            relight-firstlight-390-v3-open-valley.png
            relight-firstlight-320-v3-open-valley-default.png
            relight-firstlight-320-v3-open-valley.png
            relight-firstlight-desktop-v3-power-priority.png
          )
          missing=0
          for screenshot in "${expected[@]}"; do
            if [[ ! -s "${screenshot}" ]]; then
              echo "::error file=${screenshot}::Expected hosted gameplay screenshot is missing or empty."
              missing=1
            fi
          done
          exit "${missing}"
      - name: Archive independent hosted gameplay screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relight-live-web-screenshots
          path: |
            relight-firstlight-390-v3-opening-viewport.png
            relight-firstlight-390-v3-opening-full.png
            relight-firstlight-1440-v3-opening-viewport.png
            relight-firstlight-1440-v3-opening-full.png
            relight-firstlight-390-v3-investment-choice.png
            relight-firstlight-390-v3-priority-installed.png
            relight-firstlight-390-v3-field-link.png
            relight-firstlight-390-v3-ready-mine.png
            relight-firstlight-desktop-v3-investment-choice.png
            relight-firstlight-desktop-v3-priority-installed.png
            relight-firstlight-desktop-v3-field-link.png
            relight-firstlight-desktop-v3-ready-power.png
            relight-firstlight-390-v3-open-valley.png
            relight-firstlight-320-v3-open-valley-default.png
            relight-firstlight-320-v3-open-valley.png
            relight-firstlight-desktop-v3-power-priority.png
          if-no-files-found: error
