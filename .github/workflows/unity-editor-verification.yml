name: Unity Editor verification (opt-in)

# Unity requires a valid, separately provisioned license. Disabled by default:
# repository variable RELIGHT_UNITY_CI must be the literal 'enabled'.
on:
  push:
    branches:
      - 'feat/**'
      - 'fix/**'
      - 'build/**'
      - 'migration/**'
  workflow_dispatch:

# IMPORTANT: Unity Personal named-user licensing may not support the legacy
# GameCI UNITY_LICENSE (.ulf) activation path. Unity's own documentation says
# to activate Personal through Unity Hub. Do not enable GameCI until a
# compatible license mechanism has been independently verified for this account.
# See docs/FIRST_UNITY_BUILD.md and docs/UNITY_CI.md.
permissions:
  contents: read

jobs:
  unity-editmode:
    if: ${{ vars.RELIGHT_UNITY_CI == 'enabled' && vars.RELIGHT_GAMECI_LICENSE_CONFIRMED == 'yes' }}
    name: Unity 6000.3.27f1 EditMode tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      checks: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Confirm license credentials exist
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        shell: bash
        run: |
          if [ -z "$UNITY_EMAIL" ] || [ -z "$UNITY_PASSWORD" ]; then
            echo "::error::UNITY_EMAIL and UNITY_PASSWORD secrets are required."
            exit 1
          fi
          if [ -z "$UNITY_LICENSE" ] && [ -z "$UNITY_SERIAL" ]; then
            echo "::error::Configure a valid Unity license (UNITY_LICENSE or UNITY_SERIAL) as an Actions secret."
            exit 1
          fi
          echo "Unity license inputs are configured. No values will be printed."

      - name: Run actual Unity Editor tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          projectPath: .
          unityVersion: 6000.3.27f1
          testMode: editmode
          coverageEnabled: false
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          artifactsPath: artifacts

      - name: Preserve Unity test results and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relight-unity-editmode-${{ github.run_id }}
          path: artifacts
          if-no-files-found: warn

# Skipped when RELIGHT_UNITY_CI is not enabled. A skipped run is NOT
# evidence that Unity compiled or that any EditMode tests passed.
