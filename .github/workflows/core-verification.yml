name: Core verification

on:
  push:
    branches:
      - 'feat/**'
      - 'fix/**'
      - 'build/**'
      - 'migration/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-simulation:
    name: Compile and exercise deterministic gameplay core
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Compile and run standalone core checks
        run: dotnet run --configuration Release --project verification/Relight.CoreChecks/Relight.CoreChecks.csproj
      - name: Verify Unity LTS project and cloud runner versions match
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          version_text = Path("ProjectSettings/ProjectVersion.txt").read_text(encoding="utf-8")
          version = next((line.partition(": ")[2].strip() for line in version_text.splitlines()
                          if line.startswith("m_EditorVersion:")), "")
          if not version:
              raise SystemExit("Missing ProjectVersion.txt editor version")
          # Enforce supported LTS family for this migration, fail on obsolete 6000.1.
          if not version.startswith("6000.3.") or not version.endswith("f1"):
              raise SystemExit(f"Unsupported migration editor pin: {version}")
          revision = next((line for line in version_text.splitlines()
                           if line.startswith("m_EditorVersionWithRevision:")), "")
          if version not in revision:
              raise SystemExit("Editor version/revision mismatch")
          manifest = json.loads(Path("Packages/manifest.json").read_text(encoding="utf-8"))
          deps = manifest["dependencies"]
          if deps.get("com.unity.test-framework") != "1.6.0":
              raise SystemExit("Unity 6.3 Test Framework package pin is inconsistent")
          if deps.get("com.unity.ugui") != "2.0.0":
              raise SystemExit("Unity 6.3 UI package pin is inconsistent")
          for name in ("unity-editor-verification.yml", "unity-android-development.yml"):
              yml = Path(".github/workflows") / name
              contents = yml.read_text(encoding="utf-8")
              if f"unityVersion: {version}" not in contents:
                  raise SystemExit(f"{name} not pinned to {version}")
              if "RELIGHT_GAMECI_LICENSE_CONFIRMED" not in contents:
                  raise SystemExit(f"{name} lacks license compatibility guard")
          helper = Path("scripts/verify-unity-windows.ps1").read_text(encoding="utf-8")
          if version not in helper:
              raise SystemExit("Windows helper version differs from ProjectVersion.txt")
          print("Unity LTS version alignment OK", version)
          print("Actual Unity Editor import and cloud patch inventory NOT validated by this step.")
          PY
      - name: Parse all Unity C# sources with Roslyn
        run: dotnet run --configuration Release --project verification/Relight.SyntaxChecks/Relight.SyntaxChecks.csproj
      - name: Parse Windows Unity verifier script
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD "scripts/verify-unity-windows.ps1"),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
          # Check the exact Unity test-invocation contract, not just script syntax.
          $source = Get-Content -LiteralPath "scripts/verify-unity-windows.ps1" -Raw
          $testInvoke = [regex]::Match($source, '(?s)Invoke-Unity "Execute Unity EditMode tests" @\((.*?)\)')
          if (-not $testInvoke.Success) { throw "Unity test invocation not found." }
          if ($testInvoke.Groups[1].Value -match '"-quit"') {
            throw "-quit is unsupported together with Unity -runTests."
          }
          if ($testInvoke.Groups[1].Value -notmatch '"-runTests"') {
            throw "Unity EditMode invocation must pass -runTests."
          }
          Write-Host "PowerShell syntax and Unity test invocation contract OK; Unity not executed."
      - name: Verify Unity manifest and assemblies are parseable JSON
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          paths = [Path("Packages/manifest.json"), *Path("Assets").rglob("*.asmdef")]
          for path in paths:
              with path.open(encoding="utf-8") as f:
                  json.load(f)
              print("JSON OK", path)
          PY

  # There is deliberately no 'Unity passed' badge here: full engine imports,
  # PlayMode tests and mobile builds need a Unity editor with licensed tooling.
