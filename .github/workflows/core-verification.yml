name: Core verification

on:
  push:
    branches:
      - 'feat/**'
      - 'fix/**'
      - 'build/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-simulation:
    name: Compile and exercise deterministic gameplay core
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Compile and run standalone core checks
        run: dotnet run --configuration Release --project verification/Relight.CoreChecks/Relight.CoreChecks.csproj
      - name: Parse all Unity C# sources with Roslyn
        run: dotnet run --configuration Release --project verification/Relight.SyntaxChecks/Relight.SyntaxChecks.csproj
      - name: Parse Windows Unity verifier script
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD "scripts/verify-unity-windows.ps1"),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
          # Check the exact Unity test-invocation contract, not just script syntax.
          $source = Get-Content -LiteralPath "scripts/verify-unity-windows.ps1" -Raw
          $testInvoke = [regex]::Match($source, '(?s)Invoke-Unity "Execute Unity EditMode tests" @\((.*?)\)')
          if (-not $testInvoke.Success) { throw "Unity test invocation not found." }
          if ($testInvoke.Groups[1].Value -match '"-quit"') {
            throw "-quit is unsupported together with Unity -runTests."
          }
          if ($testInvoke.Groups[1].Value -notmatch '"-runTests"') {
            throw "Unity EditMode invocation must pass -runTests."
          }
          Write-Host "PowerShell syntax and Unity test invocation contract OK; Unity not executed."
      - name: Verify Unity manifest and assemblies are parseable JSON
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          paths = [Path("Packages/manifest.json"), *Path("Assets").rglob("*.asmdef")]
          for path in paths:
              with path.open(encoding="utf-8") as f:
                  json.load(f)
              print("JSON OK", path)
          PY

  # There is deliberately no 'Unity passed' badge here: full engine imports,
  # PlayMode tests and mobile builds need a Unity editor with licensed tooling.
